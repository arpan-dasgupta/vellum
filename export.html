<!doctype html>
<meta charset="utf-8">
<title>Vellum batch export</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<!-- Local dev tool. Needs tools/devserver.py (POST /save).
     export.html?preset=fow  exports the Fog of War boards to exports/ as SVG + PNG. -->
<style>body{font:14px/1.5 system-ui;margin:24px}pre{white-space:pre-wrap}</style>
<script src="core.js"></script>
<h1>Vellum batch export</h1>
<pre id="log">starting…</pre>
<script>
const SLUGS = ['start', '1-e4', '1-Nf6', '2-Nc3', '2-d6', '3-Bb5', '3-g6', '4-Bxe8'];
const PRESETS = {
  fow: [
    ...SLUGS.map((s, k) => ({ page: 'page-real', nodes: [`real-panel-${k}`], file: `real-${k}-${s}`, pad: 24, bg: '#F9F9F9', scale: 2 })),
    { page: 'page-real', nodes: ['real-section'], file: 'real-positions-all', pad: 0, scale: 1 },
    { page: 'page-view', nodes: ['fog-section'], file: 'whites-view-all', pad: 0, scale: 1 },
    { page: 'page-view', nodes: ['start-section'], file: 'whites-view-start', pad: 0, scale: 2 },
  ],
};
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
async function save(name, data) {
  const r = await fetch('/save?name=' + encodeURIComponent(name), { method: 'POST', body: data });
  if (!r.ok) throw new Error(`${name}: ${r.status}`);
}
// Review: render each open annotation over the document, one image per annotation, so its
// drawing can be understood visually before acting on it.
//   export.html?preset=review&ann=.tmp/ann.json   (ann = an annotations document from the artifact database)
async function review(doc, ctx, fontCss, q) {
  const ann = await (await fetch(q.get('ann') || '.tmp/ann.json')).json();
  const pg = doc.pages.find((p) => p.id === ann.pageId) || doc.pages[0];
  const strip = (n) => { const c = { ...n }; delete c.about; if (c.children) c.children = c.children.map(strip); return c; };
  const items = ann.items.map(strip);
  pg.children = pg.children.filter((n) => !(n.type === 'GROUP' && n.annotation));
  const group = { id: 'ann-review', type: 'GROUP', name: 'Annotations', annotation: true, children: items };
  pg.children.push(group);
  ctx.index = VellumCore.buildIndex(doc);
  const open = items.filter((n) => n.status !== 'resolved');
  const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const run = Date.now().toString(36);  // unique names per run, so image viewers never show a stale copy
  const overview = VellumCore.exportSVG(pg.children, ctx, { padding: 20, background: '#FFFFFF', fontCss });
  await save(`_review-${run}-overview.png`, await VellumCore.svgToPng(overview, 0.5));
  log(`overview: ${open.length} open annotation(s)`);
  for (const n of open) {
    const b = VellumCore.bounds(n, ctx);
    const pad = 200;
    const crop = { x: b.x - pad, y: b.y - pad - 40, w: b.w + pad * 2, h: b.h + pad * 2 + 40 };
    // Show only this annotation, named above it, so other marks can't be confused with it.
    const tag = { id: 'review-tag', type: 'TEXT', name: 'tag', x: b.x, y: b.y - 34, text: n.name, fontSize: 22, fontWeight: 700, color: '#C0262D', autoWidth: true };
    // ?bare=1 renders the same crop without the annotation, to check the result underneath it.
    group.children = q.get('bare') ? [] : [n, tag];
    ctx.index = VellumCore.buildIndex(doc);
    const svg = VellumCore.exportSVG(pg.children, ctx, { bounds: crop, background: '#FFFFFF', fontCss });
    group.children = items;
    const scale = Math.min(1.5, 2200 / Math.max(crop.w, crop.h));
    const file = `_review-${run}-${slug(n.name)}${q.get('bare') ? '-bare' : ''}.png`;
    await save(file, await VellumCore.svgToPng(svg, scale));
    log(`${file}: ${Math.round(crop.w)} × ${Math.round(crop.h)} at ${scale.toFixed(2)}x`);
  }
  log('done');
  document.body.dataset.done = '1';
}

(async () => {
  try {
    const q = new URLSearchParams(location.search);
    const doc = await (await fetch(q.get('doc') || 'samples/fog-of-war.json')).json();
    await Promise.all(['400', '500', '600', '700'].map((w) => document.fonts.load(`${w} 16px Inter`)));
    const c = document.createElement('canvas').getContext('2d');
    const ctx = { index: VellumCore.buildIndex(doc), measure: (t, f) => { c.font = f; return c.measureText(t).width; } };
    const fontCss = await VellumCore.embeddedFontCss();
    log(fontCss ? `embedded Inter (${Math.round(fontCss.length / 1024)} KB)` : 'could not embed Inter; using @import');
    if (q.get('preset') === 'review') { await review(doc, ctx, fontCss, q); return; }
    const jobs = PRESETS[q.get('preset') || 'fow'];
    for (const j of jobs) {
      const nodes = j.nodes.map((id) => ctx.index.map.get(id));
      const svg = VellumCore.exportSVG(nodes, ctx, { padding: j.pad, background: j.bg, fontCss, title: nodes[0].name });
      await save(j.file + '.svg', svg);
      const png = await VellumCore.svgToPng(svg, j.scale);
      await save(j.file + '.png', png);
      log(`${j.file}: svg ${Math.round(svg.length / 1024)} KB, png ${Math.round(png.size / 1024)} KB`);
    }
    log('done');
    document.body.dataset.done = '1';
  } catch (e) {
    log('ERROR ' + e.message);
    document.body.dataset.done = 'error';
  }
})();
</script>
