<!doctype html>
<meta charset="utf-8">
<title>Vellum batch export</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<!-- Local dev tool. Needs tools/devserver.py, which serves this page and saves what it renders.

     export.html?jobs=<jobs.json>
       Renders the layers a jobs file lists to SVG and PNG. See "Batch export" in README.md.
     export.html?review=<annotations.json>[&doc=<document.json>][&bare=1]
       Renders each open annotation on its own, cropped around it, into .tmp/review/.
       doc defaults to startDocument in vellum.config.json; bare=1 leaves the annotation out.

     When it finishes, the page sets document.body.dataset.done to "1", or to "error". -->
<style>body{font:14px/1.5 system-ui;margin:24px}pre{white-space:pre-wrap}</style>
<script src="core.js"></script>
<h1>Vellum batch export</h1>
<pre id="log">starting…</pre>
<script>
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
const dirOf = (p) => p.replace(/[^/]*$/, '');
// Joins a relative path onto a folder, resolving "." and "..".
function join(base, rel) {
  const out = [];
  for (const s of (base + rel).split('/')) {
    if (s === '..') out.pop();
    else if (s && s !== '.') out.push(s);
  }
  return out.join('/');
}
async function getJSON(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
}
async function save(path, data) {
  const r = await fetch('/save?path=' + encodeURIComponent(path), { method: 'POST', body: data });
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
}
const canvas = document.createElement('canvas').getContext('2d');
const makeCtx = (doc) => ({ index: VellumCore.buildIndex(doc), measure: (t, f) => { canvas.font = f; return canvas.measureText(t).width; } });

// Jobs file: { "doc": "<document.json>", "out": "<folder>", "jobs": [{ "nodes": [ids], "file", "pad", "bg", "scale" }] }
// "doc" and "out" are relative to the jobs file. Each job writes <out>/<file>.svg and .png.
async function runJobs(jobsPath, fontCss) {
  const spec = await getJSON(jobsPath);
  const base = dirOf(jobsPath);
  const ctx = makeCtx(await getJSON(join(base, spec.doc)));
  const out = join(base, spec.out || 'exports');
  for (const j of spec.jobs) {
    const nodes = j.nodes.map((id) => ctx.index.map.get(id));
    const missing = j.nodes.filter((id, i) => !nodes[i]);
    if (missing.length) throw new Error(`${j.file}: no layer with id ${missing.join(', ')}`);
    const svg = VellumCore.exportSVG(nodes, ctx, { padding: j.pad || 0, background: j.bg, fontCss, title: nodes[0].name });
    await save(`${out}/${j.file}.svg`, svg);
    const png = await VellumCore.svgToPng(svg, j.scale || 1);
    await save(`${out}/${j.file}.png`, png);
    log(`${out}/${j.file}: svg ${Math.round(svg.length / 1024)} KB, png ${Math.round(png.size / 1024)} KB`);
  }
}

// Review: one image per open annotation, showing only that annotation over the document, so
// each drawing can be understood on its own before acting on it.
async function review(annPath, q, fontCss) {
  const docPath = q.get('doc') || (await getJSON('vellum.config.json')).startDocument;
  const doc = await getJSON(docPath);
  const ctx = makeCtx(doc);
  const ann = await getJSON(annPath);
  const pg = doc.pages.find((p) => p.id === ann.pageId) || doc.pages[0];
  const strip = (n) => { const c = { ...n }; delete c.about; if (c.children) c.children = c.children.map(strip); return c; };
  const items = ann.items.map(strip);
  pg.children = pg.children.filter((n) => !(n.type === 'GROUP' && n.annotation));
  const group = { id: 'ann-review', type: 'GROUP', name: 'Annotations', annotation: true, children: items };
  pg.children.push(group);
  ctx.index = VellumCore.buildIndex(doc);
  const open = items.filter((n) => n.status !== 'resolved');
  const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const run = Date.now().toString(36);  // unique names per run, so image viewers never show a stale copy
  const bare = !!q.get('bare');
  const overview = VellumCore.exportSVG(pg.children, ctx, { padding: 20, background: '#FFFFFF', fontCss });
  await save(`.tmp/review/${run}-overview.png`, await VellumCore.svgToPng(overview, 0.5));
  log(`.tmp/review/${run}-overview.png: ${open.length} open annotation(s)`);
  for (const n of open) {
    const b = VellumCore.bounds(n, ctx);
    const pad = 200;
    const crop = { x: b.x - pad, y: b.y - pad - 40, w: b.w + pad * 2, h: b.h + pad * 2 + 40 };
    // Show only this annotation, named above it, so other marks can't be confused with it.
    const tag = { id: 'review-tag', type: 'TEXT', name: 'tag', x: b.x, y: b.y - 34, text: n.name, fontSize: 22, fontWeight: 700, color: '#C0262D', autoWidth: true };
    group.children = bare ? [] : [n, tag];
    ctx.index = VellumCore.buildIndex(doc);
    const svg = VellumCore.exportSVG(pg.children, ctx, { bounds: crop, background: '#FFFFFF', fontCss });
    group.children = items;
    const scale = Math.min(1.5, 2200 / Math.max(crop.w, crop.h));
    const file = `.tmp/review/${run}-${slug(n.name)}${bare ? '-bare' : ''}.png`;
    await save(file, await VellumCore.svgToPng(svg, scale));
    log(`${file}: ${Math.round(crop.w)} × ${Math.round(crop.h)} at ${scale.toFixed(2)}x`);
  }
}

(async () => {
  try {
    const q = new URLSearchParams(location.search);
    await Promise.all(['400', '500', '600', '700'].map((w) => document.fonts.load(`${w} 16px Inter`)));
    const fontCss = await VellumCore.embeddedFontCss();
    log(fontCss ? `embedded Inter (${Math.round(fontCss.length / 1024)} KB)` : 'could not embed Inter; using @import');
    if (q.get('review')) await review(q.get('review'), q, fontCss);
    else if (q.get('jobs')) await runJobs(q.get('jobs'), fontCss);
    else throw new Error('pass ?jobs=<jobs.json> or ?review=<annotations.json>');
    log('done');
    document.body.dataset.done = '1';
  } catch (e) {
    log('ERROR ' + e.message);
    document.body.dataset.done = 'error';
  }
})();
</script>
